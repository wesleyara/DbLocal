# Throw-away databases for development and tests. Non-default ports avoid clashes.
name: dblocal-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dblocal
      POSTGRES_PASSWORD: dblocal
      POSTGRES_DB: dblocal_dev
    ports: ['127.0.0.1:54329:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dblocal -d dblocal_dev']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dblocal
      MYSQL_DATABASE: dblocal_dev
      MYSQL_USER: dblocal
      MYSQL_PASSWORD: dblocal
    ports: ['127.0.0.1:33069:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pdblocal']
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs: [/var/lib/mysql]
