# Example: run DbLocal with Docker.
#   docker compose -f docker/compose.example.yml up -d --build
#   DBLOCAL_PASSWORD=change-me docker compose -f docker/compose.example.yml up -d --build   (with a login)
# then open http://127.0.0.1:5555
#
# DBLOCAL_PASSWORD is optional. Inside the container the server binds to 0.0.0.0 (so the published port
# works), which is why the port below is published on 127.0.0.1 only. Without a password anyone who can
# reach that port can use your databases: set one before publishing it on another interface, or put a
# reverse proxy that authenticates users in front.
name: dblocal
services:
  dblocal:
    # No published image: it is built from this checkout.
    build: { context: .., dockerfile: Dockerfile }
    image: dblocal:local
    ports:
      - '127.0.0.1:5555:5555'
    environment:
      DBLOCAL_PASSWORD: ${DBLOCAL_PASSWORD:-}
      # DBLOCAL_READONLY: '1'      # make every connection read-only
      # DBLOCAL_SECRET: ...        # encryption key for saved passwords (default: generated in /data/secret.key)
    volumes:
      - dblocal-data:/data
      # SQLite files from the host, mounted read-only. Connect to /sqlite/app.db inside DbLocal.
      # - ./databases:/sqlite:ro
    extra_hosts:
      # Reach databases running on the host (Linux; Docker Desktop already defines it):
      # use host.docker.internal as the host of the connection.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  dblocal-data:
